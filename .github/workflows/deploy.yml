name: Deploy EasyFind

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ${{ github.ref == 'refs/heads/main' && 'gamma' || 'dev-ai' }}
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'easyfind-production' || 'easyfind-development' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Environment Variables
        run: |
          # If a secret exists in the GitHub environment, we use it to construct the .env files.
          # Otherwise, we assume the .env files already exist on the self-hosted runner and skip this step.
          if [ -n "${{ secrets.MONGODB_URI }}" ]; then
            echo "Secrets found in environment. Generating .env files..."
            
            # backend/be9-easyfind
            cat << 'EOF' > backend/be9-easyfind/.env
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_URL=${{ secrets.CLOUDINARY_URL }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          PORT=5000
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          AUTH_JWT_SECRET=${{ secrets.AUTH_JWT_SECRET }}
          ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
          AUTH_SERVER_URL=${{ secrets.AUTH_SERVER_URL }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          BACKEND_URL=${{ secrets.BACKEND_URL }}
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASS=${{ secrets.EMAIL_PASS }}
          MATCHING_THRESHOLD=50
          EOF

            # backend/auth-server
            cat << 'EOF' > backend/auth-server/.env
          PORT=2999
          JWT_SECRET=${{ secrets.AUTH_JWT_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          EOF

            # frontend/fe9-easyfind-admin
            cat << 'EOF' > frontend/fe9-easyfind-admin/.env
          VITE_AUTH_BASE_URL=${{ secrets.AUTH_SERVER_URL }}
          VITE_EASYFIND_BACKEND_URL=${{ secrets.BACKEND_URL }}
          VITE_ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
          VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          EOF

            # frontend/fe9-easyfind-child
            cat << 'EOF' > frontend/fe9-easyfind-child/.env
          VITE_AUTH_BASE_URL=${{ secrets.AUTH_SERVER_URL }}
          VITE_BACKEND_URL=${{ secrets.BACKEND_URL }}
          VITE_EASYFIND_BACKEND_URL=${{ secrets.BACKEND_URL }}
          VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          EOF
          else
            echo "Secrets not found in GitHub environment. Using default fallback .env files."
            
            # backend/be9-easyfind
            cat << 'EOF' > backend/be9-easyfind/.env
          CLOUDINARY_CLOUD_NAME=
          CLOUDINARY_API_KEY=
          CLOUDINARY_API_SECRET=
          CLOUDINARY_URL=
          GOOGLE_CLIENT_ID=
          PORT=5000
          MONGODB_URI=mongodb://127.0.0.1:27017/easyfind
          JWT_SECRET=easyfind123
          AUTH_JWT_SECRET=easyfind-secret
          ADMIN_EMAILS=25075a0523@vnrvjiet.in
          AUTH_SERVER_URL=http://localhost:2999
          FRONTEND_URL=http://localhost:3109
          BACKEND_URL=http://localhost:5000
          EMAIL_USER=25075a0523@vnrvjiet.in
          EMAIL_PASS=
          MATCHING_THRESHOLD=50
          EOF

            # backend/auth-server
            cat << 'EOF' > backend/auth-server/.env
          PORT=2999
          JWT_SECRET=easyfind-secret
          GOOGLE_CLIENT_ID=
          EOF

            # frontend/fe9-easyfind-admin
            cat << 'EOF' > frontend/fe9-easyfind-admin/.env
          VITE_AUTH_BASE_URL=http://localhost:2999
          VITE_EASYFIND_BACKEND_URL=http://localhost:5000
          VITE_ADMIN_EMAILS=25075a0523@vnrvjiet.in
          VITE_GOOGLE_CLIENT_ID=
          EOF

            # frontend/fe9-easyfind-child
            cat << 'EOF' > frontend/fe9-easyfind-child/.env
          VITE_AUTH_BASE_URL=http://localhost:2999
          VITE_BACKEND_URL=http://localhost:5000
          VITE_EASYFIND_BACKEND_URL=http://localhost:5000
          VITE_GOOGLE_CLIENT_ID=
          EOF
          fi

      - name: Build and Deploy with Docker Compose
        run: |
          docker compose down
          docker compose up -d --build
